name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project and copy our code
        run: |
          flutter create --org com.expensetracker --platforms android --project-name expense_tracker app
          rm -f app/lib/main.dart app/test/widget_test.dart
          cp -r lib/. app/lib/
          cp -r test/. app/test/

      - name: Add packages
        working-directory: app
        run: flutter pub add flutter_riverpod:^2.6.1 sqflite_sqlcipher path flutter_secure_storage uuid intl

      - name: Android settings (minSdk 23+, no Android auto-backup)
        working-directory: app
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 23)/' android/app/build.gradle.kts
          sed -i 's/<application/<application android:allowBackup="false" android:fullBackupContent="false"/' android/app/src/main/AndroidManifest.xml
          grep -n "minSdk" android/app/build.gradle.kts
          grep -n "allowBackup" android/app/src/main/AndroidManifest.xml

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK for the release
        if: github.ref == 'refs/heads/main'
        run: cp app/build/app/outputs/flutter-apk/app-release.apk expense-tracker.apk

      - name: Publish APK as a GitHub Release (direct download on phone)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Expense Tracker build ${{ github.run_number }}
          make_latest: true
          files: expense-tracker.apk
