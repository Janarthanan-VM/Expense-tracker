name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project and copy our code
        run: |
          flutter create --org com.expensetracker --platforms android --project-name expense_tracker app
          rm -f app/lib/main.dart app/test/widget_test.dart
          cp -r lib/. app/lib/
          cp -r test/. app/test/
          cp -r assets app/assets

      - name: Copy Android code (payment detection)
        run: |
          main_activity=$(find app/android/app/src/main -name MainActivity.kt)
          echo "Template MainActivity: $main_activity"
          pkg_dir=$(dirname "$main_activity")
          grep -q "^package com.expensetracker.expense_tracker$" "$main_activity"
          cp native/android/kotlin/*.kt "$pkg_dir/"
          test_dir="app/android/app/src/test/kotlin/com/expensetracker/expense_tracker"
          mkdir -p "$test_dir"
          cp native/android/test/*.kt "$test_dir/"
          cp -r native/android/res/. app/android/app/src/main/res/

      - name: Add packages
        working-directory: app
        run: |
          flutter pub add flutter_riverpod:^2.6.1 sqflite_sqlcipher path flutter_secure_storage uuid intl cryptography mobile_scanner:5.2.3
          flutter pub add --dev sqflite_common_ffi

      - name: Bundle fonts
        working-directory: app
        run: python3 ../tool/patch_pubspec.py

      - name: Android settings (permissions, payment listener, minSdk 23+, no auto-backup)
        working-directory: app
        run: |
          python3 ../tool/patch_android.py
          cat android/app/src/main/AndroidManifest.xml

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (Dart)
        working-directory: app
        run: |
          set +e
          flutter test --reporter json > ../dart-tests.json
          code=$?
          set -e
          python3 ../tool/report_flutter_failures.py ../dart-tests.json "Dart tests"
          exit $code

      - name: Release signing key (keeps data across updates)
        env:
          DRIPLESS_KEYSTORE: ${{ secrets.DRIPLESS_KEYSTORE }}
        run: |
          if [ -n "$DRIPLESS_KEYSTORE" ]; then
            echo "$DRIPLESS_KEYSTORE" | base64 -d > app/android/app/dripless-release.jks
            echo "::notice title=Signing::Signed with the permanent Dripless key; this APK updates over earlier ones and keeps data."
          else
            echo "::warning title=Signing::No DRIPLESS_KEYSTORE secret, so this APK uses a temporary key and cannot update over a previous build."
          fi

      - name: Build APK
        working-directory: app
        env:
          DRIPLESS_KEY_PASSWORD: ${{ secrets.DRIPLESS_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Test (Android payment parser)
        working-directory: app/android
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --console=plain 2>&1 | tee ../../gradle-test.log

      - name: Report Android test results
        if: always()
        run: python3 tool/report_junit.py app gradle-test.log

      - name: Screenshots (design review)
        id: screens
        continue-on-error: true
        working-directory: app
        run: |
          mkdir -p test_screens
          cp ../screens/*.dart test_screens/
          flutter_root="$(dirname "$(dirname "$(command -v flutter)")")"
          cp "$flutter_root/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" test_screens/
          set +e
          flutter test test_screens --update-goldens --reporter json > ../screens.json
          code=$?
          set -e
          python3 ../tool/report_flutter_failures.py ../screens.json Screenshots
          ls -la test_screens/out || true
          exit $code

      - name: Publish screenshots (ui-preview release)
        if: always() && github.ref == 'refs/heads/main' && hashFiles('app/test_screens/out/*.png') != ''
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ui-preview
          name: UI preview (latest screenshots)
          prerelease: true
          make_latest: false
          files: app/test_screens/out/*.png
          fail_on_unmatched_files: false

      - uses: actions/upload-artifact@v4
        with:
          name: dripless-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK for the release
        if: github.ref == 'refs/heads/main'
        run: cp app/build/app/outputs/flutter-apk/app-release.apk dripless.apk

      - name: Publish APK as a GitHub Release (direct download on phone)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dripless build ${{ github.run_number }}
          make_latest: true
          files: dripless.apk
