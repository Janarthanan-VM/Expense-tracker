name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project and copy our code
        run: |
          flutter create --org com.expensetracker --platforms android --project-name expense_tracker app
          rm -f app/lib/main.dart app/test/widget_test.dart
          cp -r lib/. app/lib/
          cp -r test/. app/test/

      - name: Copy Android code (payment detection)
        run: |
          main_activity=$(find app/android/app/src/main -name MainActivity.kt)
          echo "Template MainActivity: $main_activity"
          pkg_dir=$(dirname "$main_activity")
          grep -q "^package com.expensetracker.expense_tracker$" "$main_activity"
          cp native/android/kotlin/*.kt "$pkg_dir/"
          test_dir="app/android/app/src/test/kotlin/com/expensetracker/expense_tracker"
          mkdir -p "$test_dir"
          cp native/android/test/*.kt "$test_dir/"
          cp -r native/android/res/. app/android/app/src/main/res/

      - name: Add packages
        working-directory: app
        run: flutter pub add flutter_riverpod:^2.6.1 sqflite_sqlcipher path flutter_secure_storage uuid intl

      - name: Android settings (permissions, payment listener, minSdk 23+, no auto-backup)
        working-directory: app
        run: |
          python3 ../tool/patch_android.py
          cat android/app/src/main/AndroidManifest.xml

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (Dart)
        working-directory: app
        run: flutter test

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Test (Android payment parser)
        working-directory: app/android
        run: ./gradlew :app:testReleaseUnitTest --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK for the release
        if: github.ref == 'refs/heads/main'
        run: cp app/build/app/outputs/flutter-apk/app-release.apk expense-tracker.apk

      - name: Publish APK as a GitHub Release (direct download on phone)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Expense Tracker build ${{ github.run_number }}
          make_latest: true
          files: expense-tracker.apk
